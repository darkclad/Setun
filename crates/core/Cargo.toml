[package]
name = "setun-core"
description = "Setun-11̅ emulator core: CPU, MMU, memory and devices"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
font8x8 = "0.3.1"
ternary = { path = "../ternary" }
setun-real = { path = "../real" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cranelift-codegen = "0.135"
cranelift-frontend = "0.135"
cranelift-jit = "0.135"
cranelift-module = "0.135"
cranelift-native = "0.135"

[features]
opstats = []
# The browser JIT asks the host to compile each module at once (setun_jit_service):
# for testing under node, where compiling can be synchronous.
wasm-sync-jit = []
