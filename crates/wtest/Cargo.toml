[package]
name = "setun-wtest"
description = "The fast-path tests (crates/core/tests/fast_path.rs) compiled to WebAssembly, to test the browser build's JIT under node"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ternary = { path = "../ternary" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
setun-core = { path = "../core", features = ["wasm-sync-jit"] }
