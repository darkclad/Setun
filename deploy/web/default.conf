# nginx for the web front end: the pages and setun.wasm from web/, and
# /term/ passed to ttyd in the setun-vm container (deploy/vm), websockets
# included. Both containers on one Docker network, so setun-vm is a name.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    types { application/wasm wasm; text/html html; }
    default_type application/octet-stream;
    gzip on;
    gzip_types application/wasm;
    gzip_min_length 1024;
    gzip_comp_level 6;
    # revalidate every load, so a redeploy shows at once (ETags keep it cheap)
    add_header Cache-Control "no-cache";
    location / { try_files $uri $uri/ =404; }

    location /term/ {
        # looked up when asked for, so nginx starts even while setun-vm is down
        resolver 127.0.0.11 valid=30s;
        set $vm http://setun-vm:7681;
        proxy_pass $vm;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}
